name: Daily Safety Briefing Update

on:
  schedule:
    # 22:00 UTC = 07:00 KST. GitHub 스케줄은 혼잡 시 몇 분~몇십 분 늦어질 수 있음
    - cron: '0 22 * * *'
  workflow_dispatch: {}   # Actions 탭에서 수동 실행(Run workflow) 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate index.html
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: daily safety briefing update"
          git push
